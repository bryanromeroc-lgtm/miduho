# Solo PostgreSQL para desarrollo y pruebas locales. La app corre con `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
# Credenciales ficticias de desarrollo: nunca se usan en producción.
# Si el puerto 5432 está ocupado: MIDUHO_PG_PUERTO=5433 docker compose -f docker-compose.dev.yml up -d
name: miduho-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miduho
      POSTGRES_PASSWORD: miduho
      POSTGRES_DB: miduho
    ports:
      - "127.0.0.1:${MIDUHO_PG_PUERTO:-5432}:5432"
    volumes:
      - datos-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miduho -d miduho"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos-dev:
